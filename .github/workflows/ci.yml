name: Local core checks
on:
  workflow_dispatch:
  push:
    branches: [gmk]
  pull_request:
    branches: [gmk]
permissions:
  contents: read
jobs:
  test:
    # No automatic hosted compute in private repositories under the zero-spend
    # development policy. Run the same commands locally instead.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m icart --json
      - run: git diff --check
  postgres:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: icart
          POSTGRES_PASSWORD: icart_local_only
          POSTGRES_DB: icart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icart -d icart_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: src
      ICART_TEST_DATABASE_URL: postgresql://icart:icart_local_only@127.0.0.1:5432/icart_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-postgres.txt
      - run: python -m unittest discover -s tests -v
