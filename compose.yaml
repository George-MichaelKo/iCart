name: icart-local
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: icart
      POSTGRES_PASSWORD: icart_local_only
      POSTGRES_DB: icart
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - icart_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icart -d icart"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Synthetic local development only. No automatic restart/background service.
volumes:
  icart_postgres:
